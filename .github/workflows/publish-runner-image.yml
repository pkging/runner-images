name: Publish Runner Image

on:
  workflow_dispatch:
  schedule:
    - cron: '23 * * * *'
  push:
    branches: [main]
    paths: [Dockerfile, .github/workflows/publish-runner-image.yml]

permissions:
  contents: read

concurrency:
  group: publish-runner-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Select Released Runner
        id: runner
        uses: actions/github-script@v7
        with:
          script: |
            const {data} = await github.rest.repos.getLatestRelease({owner: 'actions', repo: 'runner'});
            const version = data.tag_name.replace(/^v/, '');
            if (!/^\d+\.\d+\.\d+$/.test(version)) throw new Error('Invalid runner release');
            core.setOutput('version', version);
            core.setOutput('image', `ghcr.io/${context.repo.owner.toLowerCase()}/runner-images/actions-runner-pkging`);
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Check Published Image
        id: check
        env:
          IMAGE: ${{ steps.runner.outputs.image }}
          VERSION: ${{ steps.runner.outputs.version }}
        run: |
          set -euo pipefail
          current=$(docker buildx imagetools inspect "$IMAGE:latest" --format '{{ index .Image.Config.Labels "de.prefork.runner.version" }}' 2>/dev/null || true)
          echo "Published: ${current:-none}; released: $VERSION"
          # Hourly runs only rebuild on a new runner release; the 05:xx UTC run refreshes base layers.
          if [ "$GITHUB_EVENT_NAME" = schedule ] && [ "$current" = "$VERSION" ] && [ "$(date -u +%H)" != 05 ]; then
            echo 'skip=true' >> "$GITHUB_OUTPUT"
            echo "Image already at $VERSION, skipping build." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Build Candidate
        if: steps.check.outputs.skip != 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          pull: true
          build-args: RUNNER_VERSION=${{ steps.runner.outputs.version }}
          tags: runner-candidate:check
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            de.prefork.runner.version=${{ steps.runner.outputs.version }}
      - name: Verify Candidate
        if: steps.check.outputs.skip != 'true'
        env:
          EXPECTED: ${{ steps.runner.outputs.version }}
        run: |
          set -euo pipefail
          actual=$(docker run --rm --entrypoint /home/runner/bin/Runner.Listener runner-candidate:check --version | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$')
          test "$actual" = "$EXPECTED"
          docker run --rm --entrypoint /bin/sh runner-candidate:check -ec 'command -v docker; command -v git; command -v python3; command -v rpm; command -v gpg; test -x /home/runner/externals/node24/bin/node'
      - name: Publish Verified Candidate
        if: steps.check.outputs.skip != 'true'
        env:
          IMAGE: ${{ steps.runner.outputs.image }}
          VERSION: ${{ steps.runner.outputs.version }}
        run: |
          set -euo pipefail
          tag="${VERSION}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          docker tag runner-candidate:check "$IMAGE:$tag"
          docker push "$IMAGE:$tag"
          docker tag runner-candidate:check "$IMAGE:latest"
          docker push "$IMAGE:latest"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:$tag")
          printf '## Verified Runner Image\n\nRunner: `%s`\n\nImage: `%s`\n\nBuilt: `%s`\n' "$VERSION" "$digest" "$(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY"

  report:
    needs: publish
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v7
        env:
          RESULT: ${{ needs.publish.result }}
        with:
          script: |
            const title = '[runner-health] Image publication failed';
            const {data: issues} = await github.rest.issues.listForRepo({...context.repo, state: 'open', creator: 'github-actions[bot]', per_page: 100});
            const issue = issues.find(item => !item.pull_request && item.title === title);
            if (process.env.RESULT !== 'success') {
              const body = `Runner image publication: ${process.env.RESULT}. Existing runners are not automatically updated.\n\nhttps://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
              if (issue) await github.rest.issues.update({...context.repo, issue_number: issue.number, body});
              else await github.rest.issues.create({...context.repo, title, body});
              core.setFailed(body);
            } else if (issue) {
              await github.rest.issues.update({...context.repo, issue_number: issue.number, state: 'closed'});
            }
