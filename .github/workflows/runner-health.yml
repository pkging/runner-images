name: Runner Health

on:
  workflow_dispatch:
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/github-script@v7
        id: version
        with:
          script: |
            const {data} = await github.rest.repos.getLatestRelease({owner: 'actions', repo: 'runner'});
            core.setOutput('version', data.tag_name.replace(/^v/, ''));

  sentinel:
    needs: release
    runs-on: [self-hosted, pkging]
    timeout-minutes: 5
    steps:
      - name: Verify Runner and Docker Without Pulp
        env:
          EXPECTED: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          actual=$("$HOME/bin/Runner.Listener" --version | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$')
          printf 'Runner: %s; expected release: %s\n' "$actual" "$EXPECTED"
          test "$actual" = "$EXPECTED"
          docker version
          printf 'Runner `%s`, version `%s`, Docker reachable.\n' "$RUNNER_NAME" "$actual" >> "$GITHUB_STEP_SUMMARY"

  watchdog:
    needs: sentinel
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      issues: write
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const now = Date.now();
            const title = '[runner-health] Runner assignment or smoke test failed';
            const {data} = await github.rest.actions.listWorkflowRuns({...context.repo, workflow_id: 'runner-health.yml', per_page: 20});
            const problems = [];
            let latestSuccess = 0;
            let latestFailure = 0;
            for (const run of data.workflow_runs) {
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, {...context.repo, run_id: run.id, per_page: 100});
              for (const job of jobs.filter(item => item.name === 'sentinel')) {
                if (job.conclusion === 'success') latestSuccess = Math.max(latestSuccess, Date.parse(job.completed_at));
                if (['failure', 'timed_out', 'cancelled'].includes(job.conclusion)) latestFailure = Math.max(latestFailure, Date.parse(job.completed_at));
                if (job.status === 'queued' && now - Date.parse(job.created_at || run.created_at) > 5 * 60_000) {
                  problems.push(`Queued longer than 5 minutes: ${run.html_url}`);
                }
              }
            }
            if (latestFailure > latestSuccess) problems.push('Latest completed sentinel failed, timed out or was cancelled.');
            const oldestRun = Math.min(...data.workflow_runs.map(run => Date.parse(run.created_at)));
            if (latestSuccess ? now - latestSuccess > 45 * 60_000 : now - oldestRun > 45 * 60_000) {
              problems.push('No successful sentinel in the last 45 minutes. Check release lookup and runner assignment.');
            }
            const {data: issues} = await github.rest.issues.listForRepo({...context.repo, state: 'open', creator: 'github-actions[bot]', per_page: 100});
            const issue = issues.find(item => !item.pull_request && item.title === title);
            if (problems.length) {
              const body = `${problems.join('\n')}\n\nRun the local diagnose-arc.sh command. No automatic runner deletion is performed.`;
              if (issue) await github.rest.issues.update({...context.repo, issue_number: issue.number, body});
              else await github.rest.issues.create({...context.repo, title, body});
              core.setFailed(body);
            } else if (latestSuccess && latestSuccess > latestFailure && issue) {
              await github.rest.issues.update({...context.repo, issue_number: issue.number, state: 'closed'});
            }
